<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<link rel="stylesheet" href="main.css">
</head>
<body>
<header>🔐 Admin Panel</header>
<div>
    รหัสแอดมิน: <input type="password" id="adminPass">
    <button onclick="login(document.getElementById('adminPass').value)">เข้าสู่ระบบ</button>
</div>

<div class="admin-only">
    <button onclick="addCategory()">เพิ่มหมวดหมู่</button>
    <button onclick="deleteCategory()">ลบหมวดหมู่</button>
    <select id="categorySelect"></select>
    <input type="file" id="fileInput">
    <button onclick="upload()">อัปโหลด</button>
    <div id="adminGallery"></div>
</div>

<script src="app.js"></script>
</body>
</html>
